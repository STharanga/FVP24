name: Linux Desktop (VNC)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup User
        run: |
          sudo useradd -m roxx
          echo "roxx:123456" | sudo chpasswd
          sudo adduser roxx sudo
          sudo chown -R roxx:roxx /home/roxx

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            xfce4 xfce4-session xfce4-goodies \
            tigervnc-standalone-server \
            dbus-x11 x11-utils \
            xserver-xorg-legacy xfconf

      - name: Configure VNC
        run: |
          sudo -u roxx bash -c '
            mkdir -p /home/roxx/.vnc
            echo "vncpass" | vncpasswd -f > /home/roxx/.vnc/passwd
            chmod 600 /home/roxx/.vnc/passwd

            echo -e "#!/bin/sh
            unset SESSION_MANAGER
            unset DBUS_SESSION_BUS_ADDRESS
            export XDG_CONFIG_DIRS=/etc/xdg
            export XDG_RUNTIME_DIR=/tmp/xdg-runtime-\$(id -u)
            mkdir -p \$XDG_RUNTIME_DIR
            chmod 0700 \$XDG_RUNTIME_DIR

            # Start critical DBus services
            eval \$(dbus-launch --sh-syntax --exit-with-session)
            /usr/libexec/xfce-polkit &
            /usr/libexec/at-spi-bus-launcher --launch-immediately &

            exec startxfce4" > /home/roxx/.vnc/xstartup

            chmod +x /home/roxx/.vnc/xstartup
          '

      - name: Cleanup Existing Servers
        run: |
          sudo pkill Xvfb || true
          sudo -u roxx vncserver -kill :1 >/dev/null 2>&1 || true

      - name: Start VNC Server
        run: |
          sudo -u roxx vncserver :1 -geometry 1280x720 -depth 24 \
            -SecurityTypes VncAuth -PasswordFile /home/roxx/.vnc/passwd

      - name: Install Ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install -y ngrok

      - name: Auth Ngrok
        run: ngrok config add-authtoken 1vyToVbhRgTWWpr2n4OGWzlDhkC_7MzYHmB9MT1sHGKd8GdgU

      - name: Start Ngrok Tunnel (VNC)
        run: ngrok tcp 5901


    
