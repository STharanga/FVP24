name: Linux
on: workflow_dispatch
jobs:
  my_job:
    runs-on: ubuntu-latest
    steps:
      - name: System Setup
        run: |
          sudo useradd -m roxx
          echo "roxx:123456" | sudo chpasswd  # Set password for roxx
          sudo adduser roxx sudo

      - name: Install xrdp & XFCE
        run: |
          sudo apt update
          sudo apt install -y xfce4 xrdp xorgxrdp

      - name: Configure XFCE
        run: |
          echo "xfce4-session" | sudo tee /home/roxx/.xsession
          sudo chown roxx:roxx /home/roxx/.xsession
          sudo systemctl restart xrdp

      - name: Install Ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install -y ngrok

      - name: Auth Ngrok
        run: ngrok config add-authtoken 1vyToVbhRgTWWpr2n4OGWzlDhkC_7MzYHmB9MT1sHGKd8GdgU

      - name: Start RDP Tunnel
        run: ngrok tcp 3389

    
