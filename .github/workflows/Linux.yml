name: Linux Desktop
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup User
        run: |
          sudo useradd -m roxx
          echo "roxx:123456" | sudo chpasswd
          sudo adduser roxx sudo

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            dbus-x11 \
            xfce4-session \
            xfdesktop4 \
            xfwm4 \
            xfce4-panel \
            xfce4-terminal \
            xfconf \
            xfce4-settings \
            xserver-xorg-legacy \
            xorgxrdp \
            xrdp

      - name: Start D-Bus
        run: |
          eval `dbus-launch --sh-syntax`
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV

      - name: Configure XFCE
        run: |
          export XDG_CONFIG_DIRS=/etc/xdg:/usr/share/xfce4:/etc
          echo "XDG_CONFIG_DIRS=$XDG_CONFIG_DIRS" | sudo tee -a /etc/environment
          sudo -u roxx bash -c 'echo "exec /usr/bin/startxfce4" > ~/.xsession'
          sudo chmod +x /home/roxx/.xsession

      - name: Start XFCE Headless
        run: |
          sudo -u roxx xvfb-run --server-args="-screen 0 1280x720x24" /usr/bin/startxfce4 > /dev/null 2>&1 &

      - name: Start xrdp
        run: |
          sudo systemctl restart xrdp

      - name: Install Ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install -y ngrok

      - name: Auth Ngrok
        run: ngrok config add-authtoken 1vyToVbhRgTWWpr2n4OGWzlDhkC_7MzYHmB9MT1sHGKd8GdgU

      - name: Start Ngrok Tunnel
        run: ngrok tcp 3389  # For xrdp


    
