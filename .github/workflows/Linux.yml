name: Linux Desktop (VNC)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup User
        run: |
          sudo useradd -m -u 1001 roxx  # Explicit UID matching runner
          echo "roxx:123456" | sudo chpasswd
          sudo usermod -aG sudo roxx
          sudo chown -R roxx:roxx /home/roxx
          sudo chmod 700 /home/roxx

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            xfce4 xfce4-terminal xfce4-goodies \
            tigervnc-standalone-server dbus-x11 \
            x11-utils xserver-xorg-legacy xfconf \
            xfce4-session xfce4-panel

      - name: Configure VNC
        run: |
          sudo -u roxx bash -c '
            mkdir -p /home/roxx/.vnc
            echo "vncpass" | vncpasswd -f > /home/roxx/.vnc/passwd
            chmod 600 /home/roxx/.vnc/passwd

            cat > /home/roxx/.vnc/xstartup << "EOF"
              #!/bin/bash
              unset SESSION_MANAGER
              unset DBUS_SESSION_BUS_ADDRESS
              
              # Fix XDG Runtime Directory (explicit UID)
              export XDG_RUNTIME_DIR=/run/user/1001
              sudo mkdir -p $XDG_RUNTIME_DIR
              sudo chmod 700 $XDG_RUNTIME_DIR
              sudo chown roxx:roxx $XDG_RUNTIME_DIR
              
              # Fix DBus machine-id
              sudo mkdir -p /var/lib/dbus
              sudo ln -sf /etc/machine-id /var/lib/dbus/machine-id
              
              # Initialize D-Bus properly
              eval $(dbus-launch --sh-syntax --exit-with-session)
              export $(dbus-launch)
              
              # Start critical services
              /usr/libexec/xfce-polkit &
              /usr/libexec/at-spi-bus-launcher --launch-immediately &
              /usr/libexec/dconf-service &
              
              # Fix Xauthority
              touch /home/roxx/.Xauthority
              chmod 600 /home/roxx/.Xauthority
              
              exec startxfce4
              EOF

            chmod 755 /home/roxx/.vnc/xstartup  # Explicit execute permissions
          '

      - name: Cleanup Sessions
        run: |
          sudo pkill -9 Xvfb || true
          sudo -u roxx vncserver -kill :1 >/dev/null 2>&1 || true
          sudo rm -f /tmp/.X1-lock /tmp/.X11-unix/X1

      - name: Start VNC Server
        run: |
          sudo -u roxx bash -c '
            export USER=roxx
            export HOME=/home/roxx
            vncserver :1 -geometry 1280x720 -depth 24 \
              -localhost no \
              -SecurityTypes VncAuth -PasswordFile /home/roxx/.vnc/passwd
          '

      - name: Install Ngrok
        run: |
          curl -sSL https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.zip -o ngrok.zip
          unzip ngrok.zip
          sudo chmod +x ngrok

      - name: Auth Ngrok
        run: ngrok config add-authtoken 1vyToVbhRgTWWpr2n4OGWzlDhkC_7MzYHmB9MT1sHGKd8GdgU

      - name: Start Ngrok Tunnel (VNC)
        run: ngrok tcp 5901


    
